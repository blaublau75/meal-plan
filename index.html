<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Weekly Meal Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root {
  --cream:       #FAF8F3;
  --warm-white:  #FFFEF9;
  --sage:        #7A9E7E;
  --sage-light:  #EDF2EE;
  --sage-dark:   #4A6B4E;
  --teal:        #4E8C8A;
  --teal-light:  #E8F3F3;
  --amber:       #C8833A;
  --amber-light: #FDF3E7;
  --coral:       #C96B55;
  --coral-light: #FAEEE9;
  --purple:      #7066C8;
  --purple-light:#EEEDFE;
  --text-1:      #1C1C1A;
  --text-2:      #5C5C58;
  --text-3:      #9C9C96;
  --border:      #E8E4DC;
  --border-strong:#D0CCC2;
  --slot-b:      #C8833A;
  --slot-1:      #4E8C8A;
  --slot-2:      #4A6B4E;
  --slot-s:      #7066C8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text-1);min-height:100vh}

/* ── LAYOUT ─────────────────────────── */
.app{display:flex;min-height:100vh}
.sidebar{
  width:272px;min-width:272px;
  background:var(--warm-white);
  border-right:1px solid var(--border);
  padding:1.75rem 0;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.main{flex:1;padding:3rem 4rem;max-width:900px}

/* ── SIDEBAR ────────────────────────── */
.sidebar-head{padding:0 1.25rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.sidebar-title{font-family:'Lora',serif;font-size:17px;color:var(--text-1);margin-bottom:4px}
.sidebar-sub{font-size:12px;color:var(--text-3);line-height:1.5}
.day-group{margin-bottom:0.5rem}
.day-label{
  font-size:10px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-3);padding:.5rem 1.25rem .25rem;display:block
}
.meal-link{
  display:flex;align-items:center;gap:8px;padding:.45rem 1.25rem;
  font-size:13px;color:var(--text-2);cursor:pointer;
  border-left:2px solid transparent;transition:all .12s;text-decoration:none;line-height:1.35
}
.meal-link:hover{color:var(--text-1);background:var(--cream)}
.meal-link.active{color:var(--sage-dark);border-left-color:var(--sage);background:var(--sage-light)}
.slot-dot{
  width:7px;height:7px;border-radius:50%;flex-shrink:0
}
.slot-dot.breakfast{background:var(--slot-b)}
.slot-dot.meal1{background:var(--slot-1)}
.slot-dot.meal2{background:var(--slot-2)}
.slot-dot.snack{background:var(--slot-s)}

/* ── LEGEND ─────────────────────────── */
.legend-strip{
  display:flex;flex-wrap:wrap;gap:10px;padding:.75rem 1.25rem;
  border-top:1px solid var(--border);margin-top:.5rem
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-3)}

/* ── RECIPE HEADER ──────────────────── */
.recipe-slot{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.4rem}
.recipe-slot.breakfast{color:var(--slot-b)}
.recipe-slot.meal-1{color:var(--slot-1)}
.recipe-slot.meal-2{color:var(--slot-2)}
.recipe-slot.snack{color:var(--slot-s)}
.recipe-title{font-family:'Lora',serif;font-size:30px;line-height:1.25;color:var(--text-1);margin-bottom:.85rem}
.recipe-desc{font-size:15px;color:var(--text-2);line-height:1.7;max-width:580px}
.recipe-meta{display:flex;gap:1.25rem;margin-top:1rem;flex-wrap:wrap}
.meta-item{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-2)}
.meta-dot{width:5px;height:5px;border-radius:50%;background:var(--sage)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:.9rem}
.tag{font-size:11px;font-weight:500;padding:2px 9px;border-radius:99px}
.tag-teal{background:var(--teal-light);color:var(--teal)}
.tag-amber{background:var(--amber-light);color:var(--amber)}
.tag-coral{background:var(--coral-light);color:var(--coral)}
.tag-sage{background:var(--sage-light);color:var(--sage-dark)}
.tag-purple{background:var(--purple-light);color:var(--purple)}
hr.div{border:none;border-top:1px solid var(--border);margin:1.75rem 0}

/* ── INGREDIENTS ────────────────────── */
.section-title{font-family:'Lora',serif;font-size:20px;color:var(--text-1);margin-bottom:1.1rem}
.seed-callout{
  background:var(--sage-light);border-radius:8px;
  padding:.65rem 1rem;margin-bottom:1rem;
  font-size:13px;color:var(--sage-dark);line-height:1.5
}
.seed-callout strong{font-weight:500}
.ing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:7px;margin-bottom:1.75rem}
.ing-row{
  display:flex;align-items:baseline;gap:7px;
  padding:9px 12px;background:var(--warm-white);
  border:1px solid var(--border);border-radius:8px;font-size:13.5px
}
.ing-row.seed-highlight{border-color:var(--sage);background:var(--sage-light)}
.ing-qty{font-weight:500;color:var(--sage-dark);min-width:60px;font-size:12.5px}
.ing-name{color:var(--text-1)}
.ing-note{font-size:11.5px;color:var(--text-3);margin-left:auto;font-style:italic;text-align:right}

/* ── STEPS ──────────────────────────── */
.steps{display:flex;flex-direction:column;gap:1rem}
.step{
  display:flex;gap:1.1rem;padding:1.1rem 1.25rem;
  background:var(--warm-white);border:1px solid var(--border);border-radius:10px
}
.step-num{font-family:'Lora',serif;font-size:21px;color:var(--border-strong);min-width:26px;line-height:1;padding-top:2px}
.step-body{flex:1}
.step-title{font-weight:500;font-size:14px;color:var(--text-1);margin-bottom:3px}
.step-text{font-size:13.5px;color:var(--text-2);line-height:1.7}
.step-tip{
  margin-top:7px;padding:7px 11px;background:var(--amber-light);
  border-radius:6px;font-size:12.5px;color:var(--amber);line-height:1.5
}
.step-tip::before{content:"💡 Tip: ";font-weight:500}
.step-warn{
  margin-top:7px;padding:7px 11px;background:var(--coral-light);
  border-radius:6px;font-size:12.5px;color:var(--coral);line-height:1.5
}
.step-warn::before{content:"⚠️ Watch out: ";font-weight:500}

/* ── NAV BUTTONS ────────────────────── */
.nav-btns{
  display:flex;justify-content:space-between;
  margin-top:2.5rem;padding-top:1.75rem;border-top:1px solid var(--border)
}
.nav-btn{
  padding:9px 18px;border:1px solid var(--border-strong);border-radius:8px;
  background:var(--warm-white);font-family:'DM Sans',sans-serif;font-size:13px;
  color:var(--text-2);cursor:pointer;transition:all .13s;max-width:48%
}
.nav-btn:hover{background:var(--sage-light);color:var(--sage-dark);border-color:var(--sage)}
.nav-btn:disabled{opacity:.35;cursor:default;background:transparent}

/* ── WELCOME ────────────────────────── */
.welcome{max-width:580px;padding:1.5rem 0}
.welcome-title{font-family:'Lora',serif;font-size:36px;line-height:1.2;margin-bottom:1.1rem}
.welcome-body{font-size:15px;color:var(--text-2);line-height:1.8;margin-bottom:1.5rem}
.rules{display:flex;flex-direction:column;gap:9px}
.rule{
  display:flex;gap:11px;padding:11px 14px;
  background:var(--warm-white);border:1px solid var(--border);border-radius:8px
}
.rule-icon{font-size:17px;min-width:22px}
.rule-text{font-size:13px;color:var(--text-2);line-height:1.5}
.rule-text strong{color:var(--text-1);font-weight:500}
.slot-key{
  display:flex;flex-wrap:wrap;gap:10px;
  padding:1rem 1.25rem;background:var(--warm-white);
  border:1px solid var(--border);border-radius:8px;margin-top:1.25rem
}
.slot-key-item{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2)}
.slot-circle{width:10px;height:10px;border-radius:50%}

@media(max-width:768px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border);padding:1rem 0}
  .main{padding:1.5rem 1.25rem}
  .recipe-title{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<script>
const DATA = {

// ─────────────────────────────────────────────────────────────────
// MONDAY

monday: {
  label: "Monday",
  breakfast: {

    time: "5 min prep (night before)", difficulty: "Very easy", serves: 1,
    tags:[["Low histamine","sage"],["Omega-3 ALA","teal"],["Mast cell stable","purple"],["Heart healthy","teal"]],
    ingredients:[
      {qty:"3 tbsp",name:"chia seeds"},
      {qty:"1 cup (240 ml)",name:"oat milk"},
      {qty:"½ tsp",name:"turmeric"},
      {qty:"¼ tsp",name:"ground ginger"},
      {qty:"¼ tsp",name:"cinnamon"},

      {qty:"¼ cup (35 g)",name:"fresh blueberries",note:"to serve"},
      {qty:"1 tbsp",name:"fresh milled flaxseed",note:"grind just before serving"},
      {qty:"1 tbsp",name:"pumpkin seeds",note:"to serve"},
    ],
    steps:[
      {title:"Mix the pudding base",text:"In a jar or container with a lid, whisk together oat milk, turmeric, ginger, cinnamon, and honey until combined. Add the chia seeds and stir very well — make sure no seeds are clumped at the bottom. Stir again after 5 minutes, then seal and refrigerate overnight.",tip:"The second stir is important. Chia seeds clump together quickly if left undisturbed, creating gooey pockets instead of even pudding."},
      {title:"The morning: check and top",text:"Take the pudding out of the fridge. It should be thick and set — the chia seeds will have expanded to 8–10 times their size. If it's too thick, stir in a splash of oat milk. Grind 1 tbsp of whole flaxseeds in a small spice grinder (or coffee grinder) right now — do not use pre-ground flaxseed."},

  meal1: {

      {qty:"1 tbsp",name:"fresh milled flaxseed",note:"add after cooking"},

    steps:[
      {title:"Preheat the oven",text:"Turn your oven to 200°C (400°F). It takes about 10–15 minutes to heat up fully.",tip:"Most ovens have a light that turns off when they've reached temperature."},

      {title:"Add flaxseed and serve",text:"Grind 1 tbsp whole flaxseeds in a spice grinder right now. Stir into the hot porridge immediately. Top with blueberries and honey. Plate the salmon and asparagus alongside. Eat immediately.",tip:"Adding the freshly milled flaxseed to hot porridge and eating straight away is ideal — heat and immediate consumption minimise any oxidation."},

      {qty:"¼ tsp",name:"salt + pinch pepper"},
      {qty:"¼ cup (50 g)",name:"green or brown lentils",note:"rinsed"},
      {qty:"1 large leaf",name:"fresh kale",note:"stem removed, roughly torn"},
      {qty:"½ small",name:"leek",note:"sliced into rounds"},
      {qty:"1 medium",name:"carrot",note:"peeled, diced small"},
      {qty:"1½ cups (360 ml)",name:"low-sodium vegetable broth"},
      {qty:"¼ cup (45 g)",name:"quinoa",note:"rinsed"},
      {qty:"½ cup (120 ml)",name:"water",note:"for quinoa"},
      {qty:"1 tbsp",name:"chia seeds",note:"stirred into cooked quinoa"},
    ],
    steps:[
      {title:"Season and sear the chicken",text:"Rub chicken with EVOO, thyme, garlic, salt, and pepper. Heat a small frying pan over medium-high heat for 1 minute, then add chicken. Cook 4–5 minutes per side until golden. It doesn't need to be fully cooked through yet.",tip:"The pan is ready when a drop of water flicked onto it sizzles immediately."},
      {title:"Start the soup",text:"In a medium saucepan, combine rinsed lentils, leek, carrot, and broth. Bring to a boil over high heat, then reduce to medium-low so it simmers gently. Cook for 20 minutes."},

      {title:"Finish the soup",text:"Add kale to the soup. Place the seared chicken breast into the broth. Cook on low heat 8–10 minutes until chicken is fully cooked through — slice the thickest part; it should be white throughout with no pink.",warn:"Pink chicken means it's not safe to eat. Give it a few more minutes."},
      {title:"Slice and serve",text:"Lift out chicken, slice into thick pieces on a chopping board. Spoon chia-quinoa into a bowl, ladle soup over the top, lay sliced chicken alongside. Eat immediately."},
    ]
  },
  snack: {
    id: "mon-s", slot: "snack",
    title: "Apple slices with fresh walnut and pumpkin seed mix",
    desc: "A perfectly balanced snack combining quercetin from the apple, ALA omega-3 from fresh walnuts, and magnesium from pumpkin seeds. Takes 2 minutes to prepare.",
    time: "2 min", difficulty: "Very easy", serves: 1,
    tags:[["Mast cell stable","purple"],["Heart healthy","teal"],["Quercetin","sage"],["Magnesium","amber"]],
    ingredients:[
      {qty:"1 medium",name:"apple",note:"cored and sliced"},
      {qty:"15 g",name:"fresh walnuts",note:"crack whole walnuts just before eating"},
      {qty:"1 tbsp",name:"pumpkin seeds",note:"raw, unroasted, unsalted"},
    ],
    steps:[
      {title:"Prepare",text:"Crack or shell fresh whole walnuts just before eating — pre-packaged walnut pieces accumulate histamine. Core and slice the apple. Arrange on a plate with pumpkin seeds alongside.",tip:"Buying whole walnuts in the shell (or vacuum-sealed halves, consumed promptly after opening) is the safest approach for MCAS."},
      {title:"Eat promptly",text:"Eat straight away. Don't prep this snack in advance as the apple will brown and the walnuts will begin to oxidise."},
    ]
  }
},

// ─────────────────────────────────────────────────────────────────
// TUESDAY
// ─────────────────────────────────────────────────────────────────

  label: "Tuesday",
  breakfast: {
    id: "tue-b", slot: "breakfast",

<script>
// ── Inline data (generated from planning) ─────────────────────────────────────
const DATA_DAYS = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
const SLOT_ORDER = ["breakfast","meal1","meal2","snack"];
const SLOT_META = {
  breakfast: {label:"Breakfast",cls:"breakfast",dotCls:"breakfast"},
  meal1:     {label:"Meal 1",cls:"meal-1",dotCls:"meal1"},
  meal2:     {label:"Meal 2",cls:"meal-2",dotCls:"meal2"},
  snack:     {label:"Snack",cls:"snack",dotCls:"snack"},
};

const SEED_NAMES = ["chia","flaxseed","pumpkin seed","hemp seed"];

function isSeedIngredient(name){
  const n = name.toLowerCase();
  return SEED_NAMES.some(s => n.includes(s));
}

function buildNav(){
  let html = `
    <div class="sidebar-head">
      <div class="sidebar-title">Weekly meal plan</div>
      <div class="sidebar-sub">3 meals + snack · 7 days · beginner-friendly</div>
    </div>`;

  DATA_DAYS.forEach(dayKey => {
    const day = DATA[dayKey];
    html += `<div class="day-group"><span class="day-label">${day.label}</span>`;
    SLOT_ORDER.forEach(slot => {
      const rec = day[slot];
      if(!rec) return;
      const m = SLOT_META[slot];
      html += `<a class="meal-link" data-id="${rec.id}" onclick="show('${rec.id}')">
        <span class="slot-dot ${m.dotCls}"></span>
        <span>${rec.title}</span>
      </a>`;
    });
    html += `</div>`;
  });

  html += `
    <div class="legend-strip">
      <span class="legend-item"><span class="slot-dot breakfast" style="width:8px;height:8px;border-radius:50%;flex-shrink:0"></span> Breakfast</span>
      <span class="legend-item"><span class="slot-dot meal1" style="width:8px;height:8px;border-radius:50%;flex-shrink:0"></span> Meal 1</span>
      <span class="legend-item"><span class="slot-dot meal2" style="width:8px;height:8px;border-radius:50%;flex-shrink:0"></span> Meal 2</span>
      <span class="legend-item"><span class="slot-dot snack" style="width:8px;height:8px;border-radius:50%;flex-shrink:0"></span> Snack</span>
    </div>`;

  document.getElementById('sidebar').innerHTML = html;
}

function getRecipeById(id){
  for(const dayKey of DATA_DAYS){
    const day = DATA[dayKey];
    for(const slot of SLOT_ORDER){
      const rec = day[slot];
      if(rec && rec.id === id) return rec;
    }
  }
  return null;
}

function getAllRecipes(){
  const list = [];
  DATA_DAYS.forEach(dayKey => {
    SLOT_ORDER.forEach(slot => {
      const rec = DATA[dayKey][slot];
      if(rec) list.push(rec);
    });
  });
  return list;
}

function show(id){
  const rec = getRecipeById(id);
  if(!rec) return;

  document.querySelectorAll('.meal-link').forEach(el =>
    el.classList.toggle('active', el.dataset.id === id));

  const slotMeta = SLOT_META[rec.slot.replace(' ','').replace('meal','meal')] ||
    Object.values(SLOT_META).find(m => m.label.toLowerCase() === rec.slot.toLowerCase()) ||
    SLOT_META.meal1;

  const slotKey = Object.keys(SLOT_META).find(k => SLOT_META[k].label === rec.slot) ||
    (rec.slot === 'breakfast' ? 'breakfast' :
     rec.slot === 'meal 1' ? 'meal1' :
     rec.slot === 'meal 2' ? 'meal2' : 'snack');
  const sm = SLOT_META[slotKey] || SLOT_META.meal1;

  const hasSeedIng = rec.ingredients && rec.ingredients.some(i => isSeedIngredient(i.name));

  const tagHtml = (rec.tags||[]).map(([t,c])=>`<span class="tag tag-${c}">${t}</span>`).join('');

  const seedCallout = hasSeedIng ? `
    <div class="seed-callout">
      <strong>Seeds in this recipe:</strong> Highlighted ingredients below contain chia seeds, freshly milled flaxseed, or pumpkin seeds — superfoods added for cardiovascular and MCAS benefit. Always grind flaxseed fresh immediately before use.
    </div>` : '';

  const ingHtml = (rec.ingredients||[]).map(i => {
    const hl = isSeedIngredient(i.name) ? ' seed-highlight' : '';
    return `<div class="ing-row${hl}">
      <span class="ing-qty">${i.qty}</span>
      <span class="ing-name">${i.name}</span>
      ${i.note ? `<span class="ing-note">${i.note}</span>` : ''}
    </div>`;
  }).join('');

  const stepHtml = (rec.steps||[]).map((s,i)=>{
    let extra = '';
    if(s.tip) extra += `<div class="step-tip">${s.tip}</div>`;
    if(s.warn) extra += `<div class="step-warn">${s.warn}</div>`;
    return `<div class="step">
      <div class="step-num">${i+1}</div>
      <div class="step-body">
        <div class="step-title">${s.title}</div>
        <div class="step-text">${s.text}</div>
        ${extra}
      </div>
    </div>`;
  }).join('');

  const all = getAllRecipes();
  const idx = all.findIndex(r => r.id === id);
  const prev = all[idx-1];
  const next = all[idx+1];

  const serves = rec.serves === 1 ? '1 serving' :
    rec.serves ? `${rec.serves} servings` : '1 serving';

  document.getElementById('main').innerHTML = `
    <div>
      <div class="recipe-slot ${sm.cls}">${sm.label}</div>
      <h1 class="recipe-title">${rec.title}</h1>
      <p class="recipe-desc">${rec.desc}</p>
      <div class="recipe-meta">
        <span class="meta-item"><span class="meta-dot"></span>${rec.time||''}</span>
        <span class="meta-item"><span class="meta-dot"></span>${rec.difficulty||''}</span>
        <span class="meta-item"><span class="meta-dot"></span>${serves}</span>
      </div>
      <div class="tags">${tagHtml}</div>
    </div>
    <hr class="div">
    <h2 class="section-title">Ingredients</h2>
    ${seedCallout}
    <div class="ing-grid">${ingHtml}</div>
    <h2 class="section-title">Method</h2>
    <div class="steps">${stepHtml}</div>
    <div class="nav-btns">
      <button class="nav-btn" onclick="show('${prev?.id}')" ${!prev?'disabled':''}>
        ← ${prev ? prev.title.slice(0,36)+(prev.title.length>36?'…':'') : 'Start'}
      </button>
      <button class="nav-btn" onclick="show('${next?.id}')" ${!next?'disabled':''}>
        ${next ? next.title.slice(0,36)+(next.title.length>36?'…':'') : 'End'} →
      </button>
    </div>`;

  window.scrollTo({top:0,behavior:'smooth'});
}

function showWelcome(){
  document.getElementById('main').innerHTML = `
    <div class="welcome">
      <h1 class="welcome-title">Your personalised<br><em>weekly recipe book</em></h1>
      <p class="welcome-body">
        All recipes are single-serving (unless noted), designed to be cooked and eaten fresh.
        Each day now has a breakfast option, two main meals, and a snack —
        pick whichever combination suits your energy on the day.
      </p>
      <div class="slot-key">
        <span class="slot-key-item"><span class="slot-circle" style="background:var(--slot-b)"></span> <strong>Breakfast</strong> — optional lighter start</span>
        <span class="slot-key-item"><span class="slot-circle" style="background:var(--slot-1)"></span> <strong>Meal 1</strong> — your primary late-morning meal</span>
        <span class="slot-key-item"><span class="slot-circle" style="background:var(--slot-2)"></span> <strong>Meal 2</strong> — your primary evening meal</span>
        <span class="slot-key-item"><span class="slot-circle" style="background:var(--slot-s)"></span> <strong>Snack</strong> — low-histamine, heart-healthy</span>
      </div>
      <div class="rules" style="margin-top:1.25rem">
        <div class="rule"><div class="rule-icon">🧊</div><div class="rule-text"><strong>Always cook fresh.</strong> Histamine builds as food ages. Cook and eat each meal the same day. If prepping ahead, freeze same-day portions immediately.</div></div>
        <div class="rule"><div class="rule-icon">🌱</div><div class="rule-text"><strong>Seed rule:</strong> Seed-containing ingredients are highlighted in green. <strong>Always grind flaxseed immediately before use</strong> — never pre-ground or stored ground. Chia and pumpkin seeds can be pre-measured.</div></div>
        <div class="rule"><div class="rule-icon">💡</div><div class="rule-text"><strong>Amber tip boxes</strong> are helpful shortcuts. <strong>Red warning boxes</strong> matter for food safety or recipe success. Read before cooking.</div></div>
        <div class="rule"><div class="rule-icon">⏱</div><div class="rule-text"><strong>Read each recipe before starting.</strong> Many recipes have multiple things going simultaneously — the method tells you when to start each component.</div></div>
        <div class="rule"><div class="rule-icon">🫒</div><div class="rule-text"><strong>EVOO</strong> is extra virgin olive oil — your primary cooking fat throughout. Use generously.</div></div>
      </div>
    </div>`;
}

buildNav();
showWelcome();
</script>
